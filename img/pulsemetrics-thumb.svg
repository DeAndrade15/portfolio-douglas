<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#111118"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="glow" cx="400" cy="250" r="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#1a1a24" stroke-width="1" opacity="0.4">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- big P logo -->
  <g transform="translate(60, 60)">
    <rect width="120" height="120" rx="26" fill="url(#green)"/>
    <path fill-rule="evenodd" clip-rule="evenodd"
      d="M41 26 H69 C81.703 26 92 36.297 92 49 C92 61.703 81.703 72 69 72 H56 V94 H41 V26 Z M56 41 V57 H69 C73.418 57 77 53.418 77 49 C77 44.582 73.418 41 69 41 H56 Z"
      fill="#ffffff"/>
  </g>

  <!-- title -->
  <text x="200" y="115" font-family="Space Grotesk, system-ui, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-1">PulseMetrics</text>
  <text x="200" y="148" font-family="DM Sans, system-ui, sans-serif" font-size="18" fill="#6b7084">SaaS de gestão pra vendedores</text>

  <!-- mock dashboard card -->
  <g transform="translate(60, 220)">
    <!-- card 1 -->
    <rect width="220" height="100" rx="14" fill="#111118" stroke="rgba(16,185,129,0.25)"/>
    <text x="20" y="38" font-family="DM Sans, sans-serif" font-size="11" fill="#6b7084" letter-spacing="1">RECEBIDO</text>
    <text x="20" y="74" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="700" fill="#10b981">R$ 12.450</text>

    <!-- card 2 -->
    <rect x="240" width="220" height="100" rx="14" fill="#111118" stroke="rgba(245,158,11,0.3)"/>
    <text x="260" y="38" font-family="DM Sans, sans-serif" font-size="11" fill="#6b7084" letter-spacing="1">A RECEBER</text>
    <text x="260" y="74" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="700" fill="#f59e0b">R$ 3.280</text>

    <!-- card 3 -->
    <rect x="480" width="220" height="100" rx="14" fill="#111118" stroke="#2a2a38"/>
    <text x="500" y="38" font-family="DM Sans, sans-serif" font-size="11" fill="#6b7084" letter-spacing="1">VENDAS</text>
    <text x="500" y="74" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="700" fill="#eef0f6">R$ 15.730</text>
  </g>

  <!-- mock chart line -->
  <g transform="translate(60, 350)">
    <path d="M0 80 L80 60 L160 70 L240 30 L320 45 L400 15 L480 25 L560 5 L640 18 L680 8"
      stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M0 80 L80 60 L160 70 L240 30 L320 45 L400 15 L480 25 L560 5 L640 18 L680 8 L680 110 L0 110 Z"
      fill="#10b981" opacity="0.08"/>
  </g>

  <!-- tags -->
  <g font-family="DM Sans, sans-serif" font-size="11" font-weight="600" fill="#10b981">
    <rect x="200" y="170" width="62" height="22" rx="11" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.25)"/>
    <text x="211" y="185">React</text>
    <rect x="270" y="170" width="84" height="22" rx="11" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.25)"/>
    <text x="281" y="185">TypeScript</text>
    <rect x="362" y="170" width="72" height="22" rx="11" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.25)"/>
    <text x="373" y="185">Supabase</text>
  </g>
</svg>
