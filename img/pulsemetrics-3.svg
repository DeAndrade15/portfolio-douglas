<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#111118"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>

  <!-- backdrop blur effect -->
  <rect width="800" height="500" fill="#000" opacity="0.45"/>

  <!-- modal -->
  <g transform="translate(140, 60)">
    <rect width="520" height="380" rx="16" fill="#111118" stroke="rgba(255,255,255,0.08)"/>

    <!-- header -->
    <circle cx="34" cy="38" r="4" fill="#22c55e"/>
    <text x="46" y="42" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="700" fill="#eef0f6">Cobrar via WhatsApp</text>
    <text x="28" y="68" font-family="DM Sans, sans-serif" font-size="11" fill="#9999aa">João Pedro • 11999887766 • Deve <tspan font-weight="700" fill="#f59e0b">R$ 680,00</tspan></text>

    <!-- escolha do tom -->
    <text x="28" y="100" font-family="DM Sans, sans-serif" font-size="9" font-weight="700" fill="#6b7084" letter-spacing="0.8">ESCOLHA O TOM</text>

    <rect x="28" y="112" width="464" height="32" rx="8" fill="rgba(16,185,129,0.1)" stroke="#10b981"/>
    <text x="42" y="132" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#eef0f6">Lembrete amigável</text>

    <rect x="28" y="150" width="464" height="32" rx="8" fill="#1a1a24" stroke="rgba(255,255,255,0.06)"/>
    <text x="42" y="170" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#9999aa">Direto e cordial</text>

    <rect x="28" y="188" width="464" height="32" rx="8" fill="#1a1a24" stroke="rgba(255,255,255,0.06)"/>
    <text x="42" y="208" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#9999aa">Casual / breve</text>

    <rect x="28" y="226" width="464" height="32" rx="8" fill="#1a1a24" stroke="rgba(255,255,255,0.06)"/>
    <text x="42" y="246" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#9999aa">✏️ Escrever do zero</text>

    <!-- preview -->
    <text x="28" y="280" font-family="DM Sans, sans-serif" font-size="9" font-weight="700" fill="#6b7084" letter-spacing="0.8">PRÉ-VISUALIZAÇÃO</text>
    <rect x="28" y="288" width="464" height="64" rx="8" fill="#1a1a24" stroke="rgba(255,255,255,0.06)"/>
    <text x="42" y="307" font-family="DM Sans, sans-serif" font-size="10" fill="#c2c2cc">Oi João Pedro, tudo bem? 😊</text>
    <text x="42" y="322" font-family="DM Sans, sans-serif" font-size="10" fill="#c2c2cc">Passando pra lembrar da sua compra #ORD-4820 no</text>
    <text x="42" y="337" font-family="DM Sans, sans-serif" font-size="10" fill="#c2c2cc">valor de R$ 680,00. Quando puder me avisa! 🙌</text>

    <!-- actions -->
    <rect x="28" y="360" width="120" height="34" rx="8" fill="#1a1a24" stroke="rgba(255,255,255,0.08)"/>
    <text x="88" y="382" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="11" font-weight="600" fill="#9999aa">Cancelar</text>
    <rect x="156" y="360" width="336" height="34" rx="8" fill="#22c55e"/>
    <text x="324" y="382" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="12" font-weight="700" fill="#fff">Abrir WhatsApp →</text>
  </g>
</svg>
